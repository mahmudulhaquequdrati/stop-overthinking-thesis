76" font-size="13" fill="#0b0b0b" text-anchor="end">kept for training</text><path d="M230,252H625Q629,252 629,256V266Q629,270 625,270H230Z" fill="#4a3aa7"><title>MBPP+ (200): kept for training = 133</title></path><text x="635" y="266" font-size="11" fill="#0b0b0b" text-anchor="start">133</text><path d="M230,272H298Q302,272 302,276V286Q302,290 298,290H230Z" fill="#8a8984"><title>LiveCodeBench older (80): kept for training = 24</title></path><text x="308" y="286" font-size="11" fill="#0b0b0b" text-anchor="start">24</text></svg>
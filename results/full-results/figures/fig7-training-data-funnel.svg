<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>LoRA-2 training data: from problems to kept examples</title><rect width="900" height="330" fill="#fcfcfb"/>
<text x="20" y="28" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">LoRA-2 training data: from problems to kept examples</text><text x="20" y="48" font-size="12" fill="#52514e" text-anchor="start">Each problem got 4 thinking-ON tries. Only problems with a correct answer can give a training example.</text>
